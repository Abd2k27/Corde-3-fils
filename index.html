  <script>
    // Applique le thème avant l'affichage (évite un flash clair en mode sombre). Même logique que applyTheme() dans app.js
    (function () { var t = "auto"; try { t = localStorage.getItem("bc-theme") || "auto"; } catch (e) {}
      var h = new Date().getHours(), d = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) || (t === "soir" && (h >= 20 || h < 7));
      document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
      var l = null; try { l = localStorage.getItem("bc-lite"); } catch (e) {}
      if (l === "1" || (l === null && window.matchMedia && matchMedia("(prefers-reduced-transparency: reduce)").matches)) document.documentElement.classList.add("lite"); })();
  </script>
